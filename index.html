<!DOCTYPE html>
<html>
<head>
    <title>Flappin' Luigi</title>
    <style>
        body { background: skyblue; }
        canvas { display: block; margin: 0 auto; background: lightgreen; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game variables
        let frames = 0;
        const gravity = 0.25;
        const jump = -4.5;
        let score = 0;
        let gameOver = false;

        class Luigi {
            constructor() {
                this.x = 50;
                this.y = canvas.height / 2;
                this.width = 34;
                this.height = 26;
                this.velocity = 0;
            }
            flap() {
                this.velocity = jump;
            }
            update() {
                this.velocity += gravity;
                this.y += this.velocity;
                if (this.y + this.height > canvas.height) {
                    this.y = canvas.height - this.height;
                    gameOver = true;
                }
            }
            draw() {
                ctx.fillStyle = 'green';
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }
        }

        class Pipe {
            constructor(x) {
                this.x = x;
                this.top = Math.random() * (canvas.height / 2);
                this.bottom = Math.random() * (canvas.height / 2);
                this.width = 50;
                this.color = 'brown';
            }
            update() {
                this.x -= 2;
                if (this.x + this.width < 0) {
                    this.x = canvas.width;
                    this.top = Math.random() * (canvas.height / 2);
                    this.bottom = Math.random() * (canvas.height / 2);
                    score++;
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, 0, this.width, this.top);
                ctx.fillRect(this.x, canvas.height - this.bottom, this.width, this.bottom);
            }
            collision(luigi) {
                if (luigi.x + luigi.width > this.x && luigi.x < this.x + this.width) {
                    if (luigi.y < this.top || luigi.y + luigi.height > canvas.height - this.bottom) {
                        gameOver = true;
                    }
                }
            }
        }

        const luigi = new Luigi();
        const pipes = [new Pipe(canvas.width), new Pipe(canvas.width + 200)];

        function update() {
            if (!gameOver) {
                frames++;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                luigi.update();
                luigi.draw();
                pipes.forEach(pipe => {
                    pipe.update();
                    pipe.draw();
                    pipe.collision(luigi);
                });
                requestAnimationFrame(update);
            } else {
                ctx.fillStyle = 'black';
                ctx.font = '30px Arial';
                ctx.fillText('Game Over', canvas.width / 4, canvas.height / 2);
                ctx.fillText('Score: ' + score, canvas.width / 4, canvas.height / 2 + 50);
            }
        }

        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                luigi.flap();
            }
        });

        update();
    </script>
</body>
</html>
